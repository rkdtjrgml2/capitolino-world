<!doctype html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>혼자 걷는 로마</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Sans+KR:wght@400;600;700&display=swap">
<style>
/* Layout: full screen 3D canvas, entry sheet floats over the live world, HUD pinned to the safe edges.
   Single committed look: travertine and dusk gold over the Roman landscape. */
:root{
  --ink:#16130f;
  --ink-soft:rgba(22,19,15,.72);
  --travertine:#efe7d6;
  --stone:#cbbfa6;
  --gold:#c9a25a;
  --gold-hi:#e7c987;
  --blood:#b8392a;
  --display:"Cinzel","Trajan Pro",Georgia,serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:#16130f;color:var(--travertine);font-family:var(--body);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}

/* Entry */
#entry{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(to bottom,rgba(22,19,15,0) 30%,rgba(22,19,15,.55) 100%)}
.sheet{width:100%;max-width:440px;background:var(--ink-soft);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(201,162,90,.45);border-radius:6px;padding:22px 20px 20px;display:grid;gap:16px}
.brand{display:grid;gap:4px;text-align:center}
.brand h1{margin:0;font-family:var(--display);font-weight:700;letter-spacing:.28em;font-size:clamp(26px,7vw,34px);color:var(--gold-hi);padding-left:.28em}
.brand .sub{font-size:15px;font-weight:600;letter-spacing:.04em}
.brand .tag{font-size:12.5px;color:var(--stone)}
.lang{display:none}
.srv{display:grid;gap:8px}
.srv .head{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--stone);letter-spacing:.06em}
.srv .head b{color:var(--travertine);font-weight:600;letter-spacing:0;font-size:13px}
.srvmap{position:relative;border:1px solid rgba(201,162,90,.3);border-radius:6px;overflow:hidden;background:#141b22}
.srvmap canvas{display:block;width:100%;height:auto}
.pin{position:absolute;transform:translate(-50%,-50%);padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;line-height:1.25;white-space:nowrap;cursor:pointer;border:1px solid transparent;transition:transform .15s,background .15s}
.pin.l{transform:translate(-100%,-50%)}.pin.r{transform:translate(0,-50%)}.pin.u{transform:translate(-50%,-92%)}.pin.d{transform:translate(-50%,-8%)}.pin .sh{display:none}
@media (max-width:520px){.pin{font-size:10px;padding:2px 7px}.pin.locked{font-size:8.5px;padding:1px 5px}.pin .fl{display:none}.pin .sh{display:inline}.pin.open::before{width:5px;height:5px;margin-right:4px}}
.pin.open{background:rgba(231,201,135,.72);color:var(--ink)}.pin.open:hover{background:var(--gold-hi)}
.pin.open.cur{background:var(--gold-hi);box-shadow:0 0 0 3px rgba(231,201,135,.3),0 2px 8px rgba(0,0,0,.5);animation:pinPulse 1.8s infinite}
.pin.locked{background:rgba(22,19,15,.72);color:rgba(239,231,214,.5);border-color:rgba(239,231,214,.14);font-size:9.5px;font-weight:600;padding:2px 7px}.pin.locked:hover{color:var(--travertine)}
.pin.open::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:#2f7a3a;margin-right:5px;vertical-align:1px}
.pin.cur::after{content:"✓";margin-left:4px;font-size:10px}
@keyframes pinPulse{50%{box-shadow:0 0 0 9px rgba(231,201,135,0)}}
.srvnote{font-size:11.5px;color:var(--stone);text-align:center;min-height:1.3em}
.lang button{padding:6px 14px;border-radius:999px;font-size:13px;border:1px solid rgba(239,231,214,.25);color:var(--stone)}
.lang button[aria-pressed="true"]{background:var(--travertine);color:var(--ink);border-color:var(--travertine);font-weight:600}
.who{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.who button{display:grid;justify-items:center;gap:6px;padding:10px 4px 8px;border-radius:6px;border:1px solid rgba(239,231,214,.18);font-size:12.5px;color:var(--stone)}
.who button svg{width:40px;height:40px}
.who button[aria-pressed="true"]{border-color:var(--gold);background:rgba(201,162,90,.16);color:var(--travertine)}
.who button .cap{font-size:10.5px;color:var(--stone);opacity:.8}
#enterBtn{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:6px;background:var(--gold);color:var(--ink);
  font-weight:700;font-size:16px;letter-spacing:.06em}
#enterBtn:hover{background:var(--gold-hi)}
#citBtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:10px;padding:14px;border:0;border-radius:6px;background:var(--gold);color:var(--ink);font:inherit;font-weight:700;font-size:17px;cursor:pointer}
#citBtn:hover{background:var(--gold-hi)}#citBtn[hidden]{display:none}
.vis{margin-top:16px;padding:14px 12px 12px;border:1px solid rgba(201,162,90,.28);border-radius:8px;background:rgba(0,0,0,.18)}
.vis .visNote{display:block;margin:-2px 0 10px;color:var(--stone);font-size:12px;line-height:1.45}
.vis #enterBtn{margin-top:12px;width:100%;box-sizing:border-box}.vis .step{display:flex;margin:0 0 6px}
#enterBtn{margin-top:14px}#enterBtn.guest{background:transparent;color:var(--travertine);border:1px solid rgba(201,162,90,.55);padding:12px;font-size:15px}#enterBtn.guest:hover{background:rgba(231,201,135,.12)}
.sheet{max-height:calc(100dvh - 36px);overflow-y:auto;gap:12px}
.step{font-size:11px;letter-spacing:.08em;color:var(--stone);display:flex;align-items:center;gap:8px}
.step i{font-style:normal;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:rgba(201,162,90,.25);color:var(--gold-hi);font-size:10.5px;font-weight:700}
.acct{display:grid;gap:8px;border-top:1px solid rgba(239,231,214,.14);padding-top:12px}
.acct .gbtn{display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;border-radius:6px;background:#fff;color:#1f1f1f;font-weight:600;font-size:14px}
.acct .gbtn svg{width:18px;height:18px}
.acct small{font-size:11px;color:var(--stone);text-align:center;line-height:1.5}
@media (max-height:860px){.who button{padding:6px 2px 5px;gap:3px}.who button svg{width:30px;height:30px}.who button .cap{display:none}.brand .tag{display:none}}
.note{font-size:10.5px;color:var(--stone);opacity:.75;text-align:center;line-height:1.5}

/* HUD */
.hbtn{position:fixed;width:44px;height:44px;border-radius:50%;background:var(--ink-soft);border:1px solid rgba(201,162,90,.45);
  display:grid;place-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hbtn svg{width:22px;height:22px}
#homeBtn{top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 12px)}
#helpBtn{top:calc(env(safe-area-inset-top,0px) + 116px);left:calc(env(safe-area-inset-left,0px) + 12px)}
#bagBtn{top:calc(env(safe-area-inset-top,0px) + 64px);left:calc(env(safe-area-inset-left,0px) + 12px)}
#hotbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 48px);display:flex;gap:4px;padding:4px;background:rgba(22,19,15,.55);border:1px solid rgba(201,162,90,.4);border-radius:6px;z-index:4}
#hotbar button{position:relative;width:44px;height:44px;border-radius:4px;border:1px solid rgba(239,231,214,.16);display:grid;place-items:center;background:rgba(239,231,214,.05)}
#hotbar button svg{width:26px;height:26px}
#hotbar button.sel{border:2px solid var(--gold-hi);background:rgba(201,162,90,.22)}
#hotbar button small{position:absolute;left:3px;top:1px;font-size:9.5px;color:var(--stone)}
@media (pointer:coarse){#hotbar{left:auto;right:calc(env(safe-area-inset-right,0px) + 10px);top:34%;bottom:auto;transform:none;flex-direction:column}#hotbar button{width:38px;height:38px}#hotbar button small{display:none}}
#bobber{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font:900 56px/1 var(--display),serif;color:#ffd24a;text-shadow:0 3px 0 #7a3a10,0 0 18px rgba(255,210,74,.7);z-index:5;pointer-events:none;animation:bob .3s infinite alternate}
@keyframes bob{to{transform:translate(-50%,-62%) scale(1.08)}}
#trade{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;width:min(360px,calc(100vw - 24px))}
#trade .ibox{box-sizing:border-box;background:var(--ink-soft);border:1px solid rgba(201,162,90,.6);border-radius:6px;padding:12px;display:grid;gap:8px;color:var(--travertine);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-height:80vh;overflow:auto}
#trade .ihead{display:flex;align-items:center;gap:10px;font-size:14px}#trade .ihead .money{margin-left:auto;font-size:12.5px;color:var(--stone)}#trade .ihead .money b{color:var(--gold-hi)}
#trade .ihead button{width:30px;height:30px;display:grid;place-items:center;color:var(--stone)}#trade .ihead svg{width:16px;height:16px}
#trade .ilabel{font-size:11px;color:var(--stone);letter-spacing:.06em}
#trade .rows{display:grid;gap:4px}#trade .row{display:grid;grid-template-columns:1fr auto auto auto;gap:6px;align-items:center;font-size:12.5px}
#trade .row span i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}#trade .row b{color:var(--gold-hi);margin-left:4px}
#trade .row .pr{color:var(--gold-hi);font-size:11.5px;min-width:26px;text-align:right}#trade .row .pr::after{content:" ◎";opacity:.7}
#trade button[disabled]{opacity:.35;cursor:default}
#trade .row button{padding:3px 8px;border:1px solid rgba(201,162,90,.5);border-radius:4px;font-size:11.5px}
#trade .shop{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
#trade .shop button{display:grid;justify-items:center;gap:2px;padding:6px 2px;border:1px solid rgba(239,231,214,.18);border-radius:6px;font-size:11px}
#trade .shop svg{width:24px;height:24px}#trade .shop em{font-style:normal;color:var(--gold-hi);font-size:11px}
#trade .itip{font-size:10.5px;color:var(--stone)}
#inv{position:fixed;left:calc(env(safe-area-inset-left,0px) + 64px);top:calc(env(safe-area-inset-top,0px) + 12px);z-index:7}
#inv .ibox{box-sizing:border-box;max-height:calc(100dvh - 24px);overflow:auto;width:min(300px,calc(100vw - 80px));background:var(--ink-soft);border:1px solid rgba(201,162,90,.5);border-radius:6px;padding:12px;display:grid;gap:10px;color:var(--travertine);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#inv .ihead{display:flex;justify-content:space-between;align-items:center;font-size:14px}
#inv .ihead button{width:30px;height:30px;display:grid;place-items:center;color:var(--stone)}#inv .ihead svg{width:16px;height:16px}
#inv .eq{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
#inv .bag{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
#inv .cell{box-sizing:border-box;min-width:0;width:100%;padding:0;overflow:hidden;aspect-ratio:1;border:1px solid rgba(239,231,214,.18);border-radius:6px;display:grid;place-items:center;align-content:center;gap:2px;font-size:10px;color:var(--stone);background:rgba(239,231,214,.04)}
#inv .cell svg{width:26px;height:26px}
#inv .cell.on{border-color:var(--gold);background:rgba(201,162,90,.14);color:var(--travertine)}
#inv button.cell:hover{border-color:var(--gold-hi)}
#inv .ilabel{font-size:11px;color:var(--stone);letter-spacing:.06em}
#inv .dropb{margin-left:auto;max-width:100%;white-space:nowrap;padding:3px 8px;border:1px solid rgba(224,115,79,.6);border-radius:4px;color:#f0a58a;font-size:11.5px}
#inv .ires{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;border-top:1px solid rgba(239,231,214,.12);padding-top:8px}#inv .ires b{color:var(--gold-hi)}
#inv .itip{font-size:10.5px;color:var(--stone)}
#mapWrap{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);
  width:150px;height:150px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);box-shadow:0 2px 10px rgba(0,0,0,.35);background:#5b6b45}
#minimap{width:100%;height:100%;display:block}
#mapWrap{cursor:pointer;pointer-events:auto;transition:width .2s,height .2s}#mapWrap.big{width:min(380px,72vw,60vh);height:min(380px,72vw,60vh)}
.mmz{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);display:none;gap:6px}#mapWrap.big .mmz{display:flex}body.mmbig #u2quest{display:none!important}.mmz button{width:28px;height:28px;border-radius:50%;border:1.5px solid #c9a25a;background:rgba(43,33,25,.85);color:#f3ead8;font:700 17px/1 Georgia,serif;cursor:pointer;padding:0}
#place{position:fixed;top:calc(env(safe-area-inset-top,0px) + 168px);right:calc(env(safe-area-inset-right,0px) + 12px);width:150px;text-align:center;
  font-family:var(--display);font-size:11px;letter-spacing:.18em;color:var(--travertine);text-shadow:0 1px 3px rgba(0,0,0,.7)}
#stats{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;
  background:var(--ink-soft);border:1px solid rgba(201,162,90,.35);border-radius:999px;padding:6px 12px;backdrop-filter:blur(6px);font-variant-numeric:tabular-nums;font-size:13px;font-weight:600}
#stats .it{display:flex;align-items:center;gap:4px}
#resBar{display:flex;gap:9px;flex-wrap:wrap}#resBar .r{display:flex;align-items:center;gap:3px;font-size:12.5px;font-variant-numeric:tabular-nums}#resBar .r i{width:11px;height:11px;border-radius:3px;display:block;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}#resBar .r.z{opacity:.45}
@media (max-width:520px){#resBar{gap:6px;max-width:210px}#resBar .r{font-size:11.5px}}
#stats svg{width:18px;height:18px}
#hpBar{width:74px;height:8px;border-radius:4px;background:rgba(239,231,214,.2);overflow:hidden}
#hpBar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#c94a35,#e0734f);transition:width .2s}
#slot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--gold);display:grid;place-items:center;background:rgba(201,162,90,.12)}
#slot svg{width:20px;height:20px}
@media (max-width:520px){#stats{top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 60px);right:auto;transform:none;gap:6px;padding:5px 8px;max-width:calc(100vw - 196px);flex-wrap:wrap;border-radius:12px}#hpBar{width:48px}#resBar{max-width:none}#stats #slot{display:none}
 .hbtn{width:40px;height:40px}#homeBtn{top:calc(env(safe-area-inset-top,0px) + 10px)}#bagBtn{top:calc(env(safe-area-inset-top,0px) + 58px)}#helpBtn{top:calc(env(safe-area-inset-top,0px) + 106px)}#hud #fbBtn{top:calc(env(safe-area-inset-top,0px) + 154px)}
 #mapWrap{width:112px;height:112px}#place{top:calc(env(safe-area-inset-top,0px) + 128px);width:112px;font-size:10px;letter-spacing:.1em}
 #inv{left:50%;top:50%;transform:translate(-50%,-50%)}#inv .ibox{width:min(320px,calc(100vw - 24px))}
 #annBar#annBar{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 130px);max-width:calc(100vw - 24px)}}
@media (pointer:coarse){#hotbar{top:calc(env(safe-area-inset-top,0px) + 160px)}#hotbar button{width:34px;height:34px}#hotbar button svg{width:22px;height:22px}}
@media (pointer:coarse) and (max-height:500px){#hotbar{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);right:auto;left:50%;transform:translateX(-50%);flex-direction:row}#mapWrap{width:96px;height:96px}#place{top:112px;width:96px}}
#hint{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);
  font-size:12px;color:var(--travertine);background:var(--ink-soft);padding:6px 12px;border-radius:999px;white-space:nowrap;transition:opacity .6s;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.pill{position:fixed;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:10px 16px 10px 12px;border-radius:999px;background:var(--gold);color:var(--ink);font-weight:700;font-size:14px;
  box-shadow:0 3px 12px rgba(0,0,0,.35)}
.pill svg{width:20px;height:20px}
#nearBtn{bottom:calc(env(safe-area-inset-bottom,0px) + 56px)}
#pickBtn{bottom:calc(env(safe-area-inset-bottom,0px) + 106px);background:var(--travertine)}
#pickBtn kbd{font:600 11px var(--body);background:rgba(22,19,15,.15);border-radius:4px;padding:1px 5px}
#flyPad{position:fixed;right:calc(env(safe-area-inset-right,0px) + 16px);bottom:calc(env(safe-area-inset-bottom,0px) + 24px);display:grid;gap:12px}
#flyPad button{position:static;width:58px;height:58px}
#flyPad svg{width:26px;height:26px}
#atkBtn{right:calc(env(safe-area-inset-right,0px) + 20px);bottom:calc(env(safe-area-inset-bottom,0px) + 34px);width:76px;height:76px;background:rgba(184,57,42,.82);border-color:#e7c987}
#atkBtn svg{width:36px;height:36px}
#joy{position:fixed;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(239,231,214,.5);background:rgba(22,19,15,.25);pointer-events:none}
#joy i{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:rgba(239,231,214,.85)}
#help{position:fixed;left:calc(env(safe-area-inset-left,0px) + 66px);top:calc(env(safe-area-inset-top,0px) + 64px);max-width:min(290px,calc(100vw - 90px));min-width:180px;
  background:rgba(22,19,15,.88);border:1px solid rgba(201,162,90,.45);border-radius:6px;padding:12px 14px;font-size:12.5px;line-height:1.7;backdrop-filter:blur(6px);z-index:5}
#help b{color:var(--gold-hi);font-weight:600}
#toast{position:fixed;left:50%;top:38%;transform:translateX(-50%);font-weight:700;font-size:16px;color:var(--travertine);text-shadow:0 2px 6px rgba(0,0,0,.8);
  pointer-events:none;white-space:nowrap;transition:opacity .4s,transform .6s;opacity:0}
#hurt{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(184,57,42,.85);opacity:0;transition:opacity .25s}
#dead{position:fixed;inset:0;display:grid;place-items:center;background:rgba(22,19,15,.6);font-family:var(--display);font-size:26px;letter-spacing:.2em;color:var(--travertine);text-align:center;z-index:7}
#dead small{display:block;font-family:var(--body);font-size:13px;letter-spacing:0;margin-top:8px;color:var(--stone)}

/* Preview card */
#card{position:fixed;inset:0;display:grid;place-items:center;background:rgba(22,19,15,.45);z-index:6;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
#card .box{width:100%;max-width:380px;background:var(--travertine);color:var(--ink);border-radius:6px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.45);border-top:4px solid var(--gold)}
#card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#ddd}
#card .body{padding:14px 16px 16px;display:grid;gap:6px}
#card .host{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7a6a4c;font-weight:600}
#card h2{margin:0;font-size:19px;line-height:1.3;text-wrap:balance}
#card p{margin:0;font-size:13.5px;line-height:1.55;color:#3d362b}
#card .row{display:flex;gap:8px;margin-top:8px}
#card a.go{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:6px;background:var(--ink);color:var(--travertine);text-decoration:none;font-weight:700;font-size:15px}
#card a.go svg{width:18px;height:18px}
#card button.x{width:46px;border-radius:6px;border:1px solid #cbbfa6;display:grid;place-items:center;color:var(--ink)}
#card button.x svg{width:18px;height:18px}
#card .tiny{font-size:10.5px;color:#7a6a4c}

/* Capitolino operator hooks for the game client.

 * No library needed: talks to Supabase REST with the public publishable key.
 *
 *   CapOps.start({ server: 'kr', ver: '0.2', getState: () => ({ nickname, form, zone }) })
 *   CapOps.sendFeedback('bug' | 'idea' | 'question' | 'other', text)  -> Promise<id>
 *   CapOps.myFeedback()      -> Promise<[{id, kind, message, status, reply, fixed_version, ...}]>
 *   CapOps.onlineCounts()    -> Promise<{kr: 12, us: 0, ...}>   (for the server select map)
 *   CapOps.servers()         -> Promise<[{code, name, lang, status, capacity}]>
 *   CapOps.on('announcements', list => ...)   active notices, refreshed every 60 s
 *   CapOps.on('settings', obj => ...)         {maintenance_mode, motd, feedback_enabled, ...}
 *   CapOps.on('replies', list => ...)         operator replies the player has not seen yet
 */
(function () {
  const URL = 'https://cjlzuojkuzsqgvvymxaq.supabase.co';
  const KEY = 'sb_publishable_ZRpU6JpWT93AfNG_L9aqZA_wsnY1Wph';
  const H = { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' };

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  };
  let session = store.get('cap_session');
  if (!session) {
    session = (crypto.randomUUID && crypto.randomUUID()) ||
      'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16);
      });
    store.set('cap_session', session);
  }

  const listeners = {};
  const emit = (ev, data) => (listeners[ev] || []).forEach(fn => { try { fn(data); } catch (e) { console.warn(e); } });

  async function rpc(name, body) {
    const r = await fetch(URL + '/rest/v1/rpc/' + name, { method: 'POST', headers: H, body: JSON.stringify(body || {}) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).message || r.statusText);
    const t = await r.text(); return t ? JSON.parse(t) : null;
  }

    const r = await fetch(URL + '/rest/v1/' + path, { headers: H });
    if (!r.ok) throw new Error(r.statusText);
    return r.json();
  }

  let opts = { server: 'kr', ver: '0.0', getState: () => ({}) };
  let interval = 30, beatTimer = null, pollTimer = null;

  async function beat() {
    const s = opts.getState() || {};
    try { await rpc('heartbeat', { p_session: session, p_server: opts.server, p_nickname: s.nickname || null, p_form: s.form || null, p_zone: s.zone || null, p_ver: opts.ver }); }
    catch (e) { /* offline is fine */ }
  }
  async function poll() {
    try {
      const rows = await get('settings?select=key,value');
      const settings = Object.fromEntries(rows.map(r => [r.key, r.value]));
      const iv = Number(settings.presence_interval) || 30;
      if (iv !== interval) { interval = iv; clearInterval(beatTimer); beatTimer = setInterval(beat, interval * 1000); }
      emit('settings', settings);
    } catch (e) {}
    try {
      const now = new Date().toISOString();
      const list = await get('announcements?select=id,server,level,title,body,starts_at,ends_at&order=created_at.desc&server=in.(all,' + opts.server + ')');
      emit('announcements', list);
    } catch (e) {}
    try {
      const mine = await CapOps.myFeedback();
      const seen = Number(store.get('cap_seen_reply') || 0);
      const fresh = mine.filter(f => f.reply && new Date(f.replied_at).getTime() > seen);
      if (fresh.length) emit('replies', fresh);
    } catch (e) {}
  }

  const CapOps = {
    session,
    start(o) {
      opts = Object.assign(opts, o || {});
      beat(); poll();
      beatTimer = setInterval(beat, interval * 1000);
      pollTimer = setInterval(poll, 60000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) beat(); });
      window.addEventListener('pagehide', () => {
        try { fetch(URL + '/rest/v1/rpc/leave', { method: 'POST', headers: H, body: JSON.stringify({ p_session: session }), keepalive: true }); } catch (e) {}
      });
    },
    setServer(code) { opts.server = code; beat(); },
    on(ev, fn) { (listeners[ev] = listeners[ev] || []).push(fn); },
    sendFeedback(kind, message) {
      const s = opts.getState() || {};
      return rpc('send_feedback', {
        p_session: session, p_server: opts.server, p_kind: kind, p_message: String(message).slice(0, 2000),
        p_nickname: s.nickname || null,
        p_context: { ver: opts.ver, zone: s.zone || null, form: s.form || null, ua: navigator.userAgent.slice(0, 120), screen: innerWidth + 'x' + innerHeight },
      });
    },
    myFeedback() { return rpc('my_feedback', { p_session: session }); },
    markRepliesSeen() { store.set('cap_seen_reply', String(Date.now())); },
    async onlineCounts() { const rows = await rpc('online_counts'); return Object.fromEntries((rows || []).map(r => [r.server, Number(r.online)])); },
    servers() { return get('servers?select=code,name,lang,status,capacity&order=sort'); },
  };
  window.CapOps = CapOps;
})();

function nearTree(){let best=null,bd=3.4;const gx=Math.floor(P.x/20),gz=Math.floor(P.z/20);
 for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const L=TREEGRID[(gx+i)+","+(gz+j)];if(!L)continue;for(const t of L){if(t.down)continue;const d=Math.hypot(t.x-P.x,t.z-P.z);if(d<bd){bd=d;best=t}}}return best}
function nearNode(){let best=null,bd=3.6;for(const n of NODES){if(n.down)continue;const d=Math.hypot(n.x-P.x,n.z-P.z);if(d<bd){bd=d;best=n}}return best}
const _o=new THREE.Object3D();
function setTree(t,vis){_o.position.set(t.q[0],t.q[1],t.q[2]);_o.rotation.set(0,t.q[4],0);_o.scale.setScalar(vis?t.q[3]:0.0001);_o.updateMatrix();

const regrow=[];

 RES[k]+=n;toast(`+${n} ${T[lang].res[k]}`);updateStats()}
const fxHit=(...a)=>{try{window.__hitFx&&window.__hitFx(...a)}catch(e){}};
function nearCarcass(){let best=null,bd=3.6;for(const a of fauna){if(!a.dead||!a.carcass||a.butchering)continue;const d=Math.hypot(a.x-P.x,a.z-P.z);if(d<bd){bd=d;best=a}}return best}
function butcher(a){a.butchering=1;P.cd=1.5;P.act="butcher";P.swing=1;P.face=Math.atan2(a.x-P.x,a.z-P.z);fxHit("butcher",a);
 setTimeout(()=>{a.butchering=0;if(P.dead||Math.hypot(a.x-P.x,a.z-P.z)>4.5||!a.dead||!a.carcass)return;const L=a.carcass;a.carcass=null;
  const y=heightAt(a.x,a.z)+.5;gain("food",L.food,a.x,y,a.z);setTimeout(()=>gain("hide",L.hide,a.x,y,a.z),160);fxHit("butchered",a);a.deadT=Math.max(a.deadT,18.6)},1350)}
window.__harvest={nearCarcass};
function gather(){if(P.kind!=="human"||P.dead||P.cd>0)return false;const h=curHand();
 const cc=nearCarcass();if(cc){butcher(cc);return true}
 const n=nearNode();if(n){if(h!=="pick"){toast(T[lang].needPick);return true}
  P.cd=.7;P.swing=1;P.act="mine";P.face=Math.atan2(n.x-P.x,n.z-P.z);n.hp-=1;const amt=n.res==="stone"?1+(Math.random()<.4?1:0):(n.g===2?2:n.g===1?(Math.random()<.5?2:1):1);
  fxHit("rock",n);gain(n.res,amt,n.x,heightAt(n.x,n.z)+1.2,n.z);
  if(n.hp<=0){n.down=1;fxHit("rockDone",n);n.meshes.forEach(m=>m.visible=false);regrow.push({n,at:clock.elapsedTime+240});toast(T[lang].depleted)}return true}
 const t=nearTree();if(t){P.cd=h==="axe"?.6:.9;P.swing=1;P.act="chop";P.face=Math.atan2(t.x-P.x,t.z-P.z);t.hp-=h==="axe"?1.4:.5;const amt=h==="axe"?2:1;
  fxHit("tree",t);gain("wood",amt,t.x,t.q[1]+1.6,t.z);
  if(t.hp<=0){t.down=1;fxHit("fell",t);setTree(t,false);regrow.push({t,at:clock.elapsedTime+180})}return true}
 return false}
function updateRegrow(){const now=clock.elapsedTime;for(let i=regrow.length-1;i>=0;i--){const r=regrow[i];if(now<r.at)continue;

function dropHeld(){if(P.kind!=="human")return;const k=curHand();if(!k)return;P.slots[P.sel]=null;
 dropItem(k,P.x+Math.sin(P.face)*1.6,P.z+Math.cos(P.face)*1.6);toast(`${T[lang].dropped} · ${T[lang].weapons[k]}`);refreshHand()}
function nearStall(){for(const [x,z] of STALLS)if(Math.hypot(P.x-x,P.z-z)<4.2)return true;return false}
const PRICE={food:2,wood:1,stone:2,iron:6,silver:15,gold:40,hide:4};
const SHOP=[["pick",12],["axe",14],["rod",6],["spear",22],["sword",35],["dagger",8],["longsword",55]];
function renderTrade(){const t=T[lang],el=$("trade");if(el.hidden)return;
 let h=`<div class="ihead"><b>${t.trade}</b><span class="money">${t.res.denarius} <b>${RES.denarius}</b></span><button id="tradeClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`;
 h+=`<div class="ilabel">${t.sell}</div><div class="rows">`+Object.keys(PRICE).map(k=>`<div class="row"><span><i style="background:${RES_COL[k]}"></i>${t.res[k]} <b>${RES[k]}</b></span><span class="pr">${PRICE[k]}</span><button data-s1="${k}" ${RES[k]?"":"disabled"}>${t.sell} 1</button><button data-sa="${k}" ${RES[k]?"":"disabled"}>${t.sellAll}</button></div>`).join("")+`</div>`;
 h+=`<div class="ilabel">${t.buy}</div><div class="shop">`+SHOP.map(([k,c])=>`<button data-b="${k}" ${RES.denarius>=c?"":"disabled"}>${SLOT_SVG[k]}<span>${t.weapons[k]}</span><em>${c}</em></button>`).join("")+`</div><div class="itip">${t.tradeNote}</div>`;
 el.querySelector(".ibox").innerHTML=h;$("tradeClose").onclick=()=>{el.hidden=true};
 el.querySelectorAll("[data-s1],[data-sa]").forEach(b=>b.onclick=()=>{const k=b.dataset.s1||b.dataset.sa,n=b.dataset.s1?1:RES[k];if(!n)return;RES[k]-=n;RES.denarius+=n*PRICE[k];updateStats();renderTrade()});

  const i=P.slots.indexOf(null);if(i<0){toast(t.bagFull2);return}RES.denarius-=c;P.slots[i]=k;toast(t.weapons[k]);refreshHand();renderTrade()})}

/* ============ fishing: cast, wait for !, then click ============ */
const FISH={on:false,t:0,biteAt:0,bobber:null};
function stopFishing(){if(FISH.bobber){scene.remove(FISH.bobber);FISH.bobber=null}FISH.on=false;$("bobber").hidden=true}
function castLine(){const fx=P.x+Math.sin(P.face)*6,fz=P.z+Math.cos(P.face)*6;
 if(heightAt(fx,fz)>-.4){toast(T[lang].needWater);return}
 stopFishing();const b=new THREE.Group();const top=new THREE.Mesh(new THREE.SphereGeometry(.18,8,6),phong(0xd8382a));const bot=new THREE.Mesh(new THREE.SphereGeometry(.18,8,6,0,6.3,Math.PI/2,Math.PI/2),phong(0xf2ead6));
 b.add(top,bot);b.position.set(fx,.05,fz);scene.add(b);FISH.bobber=b;FISH.on=true;FISH.t=0;FISH.biteAt=2+Math.random()*5;
 const zn=zoneAtM(fx/G,fz/G,["fish"]);FISH.rich=zn?1:.35;toast(T[lang].cast)}
function reelIn(){if(!FISH.on)return;const biting=FISH.t>FISH.biteAt&&FISH.t<FISH.biteAt+1.3;
 if(biting&&Math.random()<FISH.rich+.25){const n=FISH.rich>=1?2:1;const b=FISH.bobber.position;fxHit("fish",b);gain("food",n,b.x,.4,b.z)}else toast(T[lang].miss);stopFishing()}
function updateFishing(dt,t){if(!FISH.on)return;FISH.t+=dt;const b=FISH.bobber;

 const biting=FISH.t>FISH.biteAt&&FISH.t<FISH.biteAt+1.3;b.position.y=biting?-.12+Math.sin(t*30)*.08:.05+Math.sin(t*3)*.04;
 $("bobber").hidden=!biting;if(FISH.t>FISH.biteAt+1.3){toast(T[lang].miss);FISH.t=0;FISH.biteAt=2+Math.random()*5}}
function useItem(){if(P.kind==="human"&&curHand()==="rod"){if(FISH.on)reelIn();else castLine();return true}return false}
const BEAST_W={wolf:"bite",deer:"kick",boar:"tusk",bear:"claw"};
function weaponOf(){return P.kind==="human"?WEAP[P.hand||"fist"]:BEAST_W[P.kind]?WEAP[BEAST_W[P.kind]]:null}
function attack(target){
 if(P.dead||mode!=="play")return;const w=weaponOf();if(!w||P.cd>0)return;
 P.cd=w.cd;P.swing=1;
 let tgt=null,bd=1e9;
 for(const a of fauna){if(a.kind==="crow"||a.dead||P.kind===a.kind)continue;const dx=a.x-P.x,dz=a.z-P.z,d=Math.hypot(dx,dz);if(d>w.reach+.9)continue;
  const dot=(dx*Math.sin(P.face)+dz*Math.cos(P.face))/(d||1);const score=d-dot*1.5-(a===target?5:0);if(score<bd){bd=score;tgt=a}}

 tgt.hp-=w.dmg;tgt.flash=.18;
 const kx=(tgt.x-P.x),kz=(tgt.z-P.z),kl=Math.hypot(kx,kz)||1;tgt.x+=kx/kl*.5;tgt.z+=kz/kl*.5;
 if(tgt.kind==="hare"){tgt.flee=2}else if(tgt.kind==="deer"){tgt.tx=tgt.x+kx/kl*30;tgt.tz=tgt.z+kz/kl*30;tgt.wait=0;tgt.flee=3}else tgt.aggro=10;
 if(tgt.hp<=0)kill(tgt);
}
function kill(a){a.dead=1;a.deadT=0;a.c.g.rotation.z=Math.PI/2;for(const m of a.mats)m.emissive.setHex(0);const L=LOOT[a.kind];

 const y=heightAt(a.x,a.z)+.5;gain("food",L.food,a.x,y,a.z);gain("hide",L.hide,a.x,y,a.z)}
function hurt(d){if(P.dead)return;P.hp-=d;P.lastHurt=0;$("hurt").style.opacity=1;setTimeout(()=>$("hurt").style.opacity=0,180);updateStats();
 if(P.hp<=0){P.dead=true;RES_KEYS.forEach(k=>{if(k!=="denarius")RES[k]=0});updateStats();$("dead").hidden=false;setTimeout(()=>{$("dead").hidden=true;goHome()},2600)}}

 else if(P.kind!=="crow"){const nh=groundAt(nx,nz),lim=Math.max(.05,sp*dt*1.7);if(nh-gh>lim&&!onBridge(nx,nz)){const ax=heightAt(nx,P.z),az=heightAt(P.x,nz);
   if(ax-gh<lim)nz=P.z;else if(az-gh<lim)nx=P.x;else{nx=P.x;nz=P.z}}}
 {const hit=(x,z)=>{const k=blockedAt(x,z,.4);return k&&!(P.kind==="crow"&&P.y>k.top)};

let camD=9;
function updateCamera(dt,target,eyeH){
 cam.target.lerp(tmpV.set(target.x,target.y+eyeH,target.z),Math.min(1,dt*10));
 const cp=Math.cos(cam.pitch);let D=cam.dist;
 for(let k=1;k<=12;k++){const dd=cam.dist*k/12,qx=cam.target.x+Math.sin(cam.yaw)*cp*dd,qz=cam.target.z+Math.cos(cam.yaw)*cp*dd,qy=cam.target.y+Math.sin(cam.pitch)*dd;const b=blockedAt(qx,qz,.6);if(b&&qy<b.top){D=Math.max(2.2,dd-cam.dist/12);break}}
 camD+=(D-camD)*Math.min(1,dt*(D<camD?20:4));
 let x=cam.target.x+Math.sin(cam.yaw)*cp*camD,z=cam.target.z+Math.cos(cam.yaw)*cp*camD,y=cam.target.y+Math.sin(cam.pitch)*camD;

  const hostile=playing&&P.kind!==a.kind&&P.kind!=="crow"&&((a.kind==="wolf"&&pd<18)||(a.kind==="boar"&&a.aggro>0&&pd<30)||(a.kind==="bear"&&(pd<9||(a.aggro>0&&pd<35))));
  if(a.aggro>0)a.aggro-=dt;

   if(pd<(a.kind==="bear"?2.6:1.9)){sp=0;a.bite-=dt;if(a.bite<=0){a.bite=a.kind==="wolf"?1.3:a.kind==="bear"?1.8:1.6;hurt(a.kind==="wolf"?1:a.kind==="bear"?3:2)}}}
  else if(a.kind==="hare"&&playing&&P.kind!=="crow"&&pd<12){const px=a.x-P.x,pz=a.z-P.z;a.tx=a.x+px/pd*20;a.tz=a.z+pz/pd*20;a.wait=0;a.flee=1.5}
