:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}

.spacer{flex:1}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}

@media (prefers-reduced-motion:no-preference){.meter i{transition:width .6s ease}}
</style>

/* ───────── demo data (marked as examples) ───────── */

  const stats=[]; for(let k=24*6;k>=0;k--){ const t=now-k*10*min, h=new Date(t).getHours(); const base=h>=19&&h<=23?11:h>=9&&h<19?6:2; stats.push({ts:new Date(t).toISOString(),server:"kr",online:Math.max(0,Math.round(base+Math.sin(k/5)*2+(k%7)/3))}); }
  stats[stats.length-1].online=presence.length;
  const fb=(id,kind,status,msg,nick,mAgo,extra={})=>({id,server:"kr",session_id:"demo",nickname:nick,kind,message:msg,status,created_at:new Date(now-mAgo*min).toISOString(),context:{ver:"0.2",zone:ZONES[id%ZONES.length],ua:"Chrome / Windows"},reply:null,replied_at:null,fixed_version:null,...extra});
  const feedback=[

    fb(7,"bug","reviewing","티베르 섬 다리 끝에서 캐릭터가 물 속으로 빠져요.","티베르낚시꾼",55),
    fb(6,"question","new","데나리우스는 어디서 벌 수 있나요?","로마산책",80),

    fb(3,"other","wontfix","로마 말고 서울도 만들어 주세요!","마르쿠스",1500,{reply:"지금은 로마에 집중하고 있어요. 나중에 다른 도시도 계획 중입니다.",replied_at:new Date(now-1400*min).toISOString()})];
  const announcements=[

/* ───────── data layer ───────── */
async function load(){
  if(!live){ if(!D) D=demoData(); return; }
  const since=new Date(Date.now()-24*3600000).toISOString(), onlineSince=new Date(Date.now()-90000).toISOString();
  const [s,p,st,f,a,c]=await Promise.all([
    sb.from("servers").select("*").order("sort"),
    sb.from("presence").select("*").gt("last_seen",onlineSince).order("first_seen"),
    sb.from("stats_minute").select("*").gt("ts",since).order("ts"),
    sb.from("feedback").select("*").order("created_at",{ascending:false}).limit(300),
    sb.from("announcements").select("*").order("created_at",{ascending:false}).limit(50),
    sb.from("settings").select("*").order("key")]);
  const err=[s,p,st,f,a,c].find(r=>r.error);
  if(err){ toast("불러오기 실패: "+err.error.message); return; }
  const [m,v,pk]=await Promise.all([
    sb.rpc("admin_members"),
    sb.from("presence").select("*").order("first_seen",{ascending:false}).limit(500),
    sb.rpc("admin_daily_peaks",{p_days:30})]);
  const err2=[m,v,pk].find(r=>r.error); if(err2) toast("회원 정보 불러오기 실패: "+err2.error.message);
  D={servers:s.data,presence:p.data,stats:st.data,feedback:f.data,announcements:a.data,settings:c.data,members:m.data||[],visits:v.data||[],peaks:pk.data||[]};
}
async function save(table,match,patch){
  if(!live){ const row=D[table].find(r=>Object.entries(match).every(([k,v])=>r[k]===v)); Object.assign(row,patch); return true; }
  let q=sb.from(table).update(patch); for(const [k,v] of Object.entries(match)) q=q.eq(k,v);
  const {error}=await q; if(error){ toast("저장 실패: "+error.message); return false; } return true;
}
async function insert(table,row){
  if(!live){ row.id=Math.max(0,...D[table].map(r=>r.id))+1; row.created_at=new Date().toISOString(); D[table].unshift(row); return true; }
  const {error}=await sb.from(table).insert(row); if(error){ toast("저장 실패: "+error.message); return false; } return true;
}

/* ───────── views ───────── */
function setting(k,d){ const r=D.settings.find(s=>s.key===k); return r?r.value:d; }
function load3(s){ const r=onlineBy(s.code)/Math.max(1,s.capacity), b=Number(setting("busy_threshold",.7)), f=Number(setting("full_threshold",.95)); return r>=f?["closed","포화"]:r>=b?["maintenance","혼잡"]:["open","원활"]; }
function onlineBy(code){ return D.presence.filter(p=>p.server===code).length; }
function peakToday(){ const t0=new Date(); t0.setHours(0,0,0,0); const byTs={}; D.stats.filter(s=>new Date(s.ts)>=t0).forEach(s=>byTs[s.ts]=(byTs[s.ts]||0)+s.online); return Math.max(D.presence.length,0,...Object.values(byTs)); }

function chart(){
  const byTs={}; D.stats.forEach(s=>byTs[s.ts]=(byTs[s.ts]||0)+s.online);
  const tenMin={}; Object.entries(byTs).forEach(([ts,v])=>{ const k=Math.floor(new Date(ts)/600000)*600000; tenMin[k]=Math.max(tenMin[k]||0,v); });
  const pts=Object.entries(tenMin).map(([k,v])=>[+k,v]).sort((a,b)=>a[0]-b[0]);
  if(pts.length<2) return `<div class="empty">접속 기록이 쌓이면 지난 24시간 그래프가 여기에 그려집니다.</div>`;
  const W=760,H=180,L=34,R=12,T=12,B=24, t1=Date.now(), t0=t1-24*3600000;
  const max=Math.max(4,...pts.map(p=>p[1])), yMax=Math.ceil(max/4)*4;
  const x=t=>L+(t-t0)/(t1-t0)*(W-L-R), y=v=>T+(1-v/yMax)*(H-T-B);
  const line=pts.map((p,i)=>(i?"L":"M")+x(p[0]).toFixed(1)+" "+y(p[1]).toFixed(1)).join(" ");
  const area=line+` L${x(pts.at(-1)[0]).toFixed(1)} ${y(0)} L${x(pts[0][0]).toFixed(1)} ${y(0)} Z`;
  let grid=""; for(let i=0;i<=4;i++){ const v=yMax*i/4; grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+3}" text-anchor="end">${v}</text>`; }
  for(let h=0;h<=24;h+=6){ const t=t0+h*3600000; const d=new Date(t); grid+=`<text x="${x(t)}" y="${H-6}" text-anchor="middle">${String(d.getHours()).padStart(2,"0")}:00</text>`; }
  const last=pts.at(-1);
  return `<div class="tablewrap"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="지난 24시간 동시 접속자">
    ${grid}<path d="${area}" fill="var(--accent)" opacity=".12"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>
    <circle cx="${x(last[0])}" cy="${y(last[1])}" r="4" fill="var(--accent)"/></svg></div>`;
}

const memo={};
async function memberDetail(id){
  if(memo[id]) return memo[id];
  if(!live){ memo[id]={characters:[{server:"kr",form:"human",playtime_sec:5400,updated_at:new Date().toISOString(),pos:{x:12,z:40}}],resources:[{server:"kr",resource:"denarius",amount:340},{server:"kr",resource:"wood",amount:22}],inventory:[{server:"kr",place:"bag",item_code:"axe_bronze",qty:1,durability:80}],parcels:[{id:2,server:"kr",zone:"frontier",shape:{plot:2},price:62,bought_at:new Date().toISOString()}],signs:[]}; return memo[id]; }
  const [c,r,i,pa,sg]=await Promise.all([
    sb.from("characters").select("*").eq("user_id",id).order("server"),
    sb.from("resources").select("*").eq("user_id",id).order("server"),
    sb.from("inventory").select("*").eq("user_id",id).order("server").order("place").order("slot"),
    sb.from("parcels").select("*").eq("owner_id",id).order("server"),
    sb.from("signs").select("*").eq("owner_id",id).order("created_at",{ascending:false})]);
  const e=[c,r,i,pa,sg].find(x=>x.error); if(e){ toast("회원 상세 불러오기 실패: "+e.error.message); return null; }
  memo[id]={characters:c.data,resources:r.data,inventory:i.data,parcels:pa.data,signs:sg.data}; return memo[id];
}

      <div class="filters"><input id="mq" type="search" placeholder="이름, 이메일, 시민 번호로 찾기" value="${esc(ui.q||"")}" aria-label="회원 찾기"></div>
      ${list.length?`<div class="tablewrap"><table><thead><tr><th class="num">번호</th><th>이름</th><th>서버</th><th class="num">데나리우스</th><th>최근 접속</th></tr></thead><tbody>
      ${list.map(x=>`<tr class="pick" tabindex="0" data-mid="${esc(x.id)}" aria-selected="${x.id===ui.msel}"><td class="num">${x.citizen_no}</td><td>${esc(x.display_name||"이름 미정")}${x.banned?` <span class="pill p-closed">정지</span>`:""}</td><td>${esc((x.servers||[]).join(" ").toUpperCase())}</td><td class="num">${Number(x.denarius||0).toLocaleString()}</td><td>${x.last_login?ago(x.last_login):""}</td></tr>`).join("")}
      </tbody></table></div>`:`<div class="empty">${D.members.length?"찾는 회원이 없습니다.":"아직 가입한 회원이 없습니다."}</div>`}
    </div>
    <div class="panel detail">${m?`
      <h2>시민 ${m.citizen_no} ${esc(m.display_name||"")}</h2>
      <dl class="kv">
        <dt>이메일</dt><dd>${esc(m.email||"")}</dd>
        <dt>가입</dt><dd>${fmtTime(m.created_at)}</dd>
        <dt>최근 로그인</dt><dd>${m.last_login?fmtTime(m.last_login):"없음"}</dd>
        <dt>플레이 시간</dt><dd>${dur(m.playtime_sec)}</dd>
        <dt>상태</dt><dd>${m.banned?`<span class="pill p-closed">정지</span> ${esc(m.ban_reason||"")}`:`<span class="pill p-open">정상</span>`}</dd>
      </dl>
      ${!det?`<div class="empty">불러오는 중입니다</div>`:`
      <div class="sub">서버별 캐릭터</div>
      ${det.characters.length?`<div class="tablewrap"><table><thead><tr><th>서버</th><th>모습</th><th class="num">플레이</th><th>마지막 저장</th></tr></thead><tbody>${det.characters.map(c=>`<tr><td>${esc(c.server.toUpperCase())}</td><td>${esc(formKo(c.form))}</td><td class="num">${dur(c.playtime_sec)}</td><td>${fmtTime(c.updated_at)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="note">아직 서버에 들어간 적이 없습니다.</p>`}
      <div class="sub">자원</div>
      ${det.resources.length?`<div class="tablewrap"><table><thead><tr><th>서버</th><th>자원</th><th class="num">수량</th></tr></thead><tbody>${det.resources.filter(r=>r.amount>0||r.resource==="denarius").map(r=>`<tr><td>${esc(r.server.toUpperCase())}</td><td>${RES[r.resource]||esc(r.resource)}</td><td class="num">${Number(r.amount).toLocaleString()}</td></tr>`).join("")}</tbody></table></div>`:`<p class="note">자원이 없습니다.</p>`}
      <div class="sub">소지품</div>
      ${det.inventory.length?`<div class="tablewrap"><table><thead><tr><th>서버</th><th>보관</th><th>아이템</th><th class="num">수량</th><th class="num">내구도</th></tr></thead><tbody>${det.inventory.map(i=>`<tr><td>${esc(i.server.toUpperCase())}</td><td>${PLACE[i.place]||esc(i.place)}</td><td>${esc(i.item_code)}</td><td class="num">${i.qty}</td><td class="num">${i.durability??""}</td></tr>`).join("")}</tbody></table></div>`:`<p class="note">서버에 저장된 소지품이 없습니다.</p>`}
      <div class="sub">땅</div>
      ${det.parcels.length?`<div class="tablewrap"><table><thead><tr><th>서버</th><th>필지</th><th class="num">가격</th><th>산 날</th></tr></thead><tbody>${det.parcels.map(p=>`<tr><td>${esc(p.server.toUpperCase())}</td><td>${p.zone==="frontier"?"개척지":esc(p.zone||"")} ${esc(p.shape?.plot??p.id)}번</td><td class="num">${p.price}</td><td>${p.bought_at?fmtTime(p.bought_at):""}</td></tr>`).join("")}</tbody></table></div>`:`<p class="note">가진 땅이 없습니다.</p>`}
      <div class="sub">링크 간판</div>
      ${det.signs.length?det.signs.map(g=>`<div class="ann"><div class="row"><span class="pill p-${g.status==="approved"?"open":g.status==="pending"?"new":"closed"}">${{approved:"승인",pending:"심사 대기",rejected:"거절"}[g.status]}</span><span class="note">${fmtTime(g.created_at)}</span></div><div class="t">${esc(g.title)}</div><div class="note" style="overflow-wrap:anywhere">${esc(g.url)}</div></div>`).join(""):`<p class="note">신청한 간판이 없습니다.</p>`}
      <div class="row" style="margin-top:12px"><button class="btn" type="button" id="mreload">다시 불러오기</button></div>`}
    `:`<div class="empty">왼쪽에서 회원을 고르면 서버별 자원, 소지품, 땅, 간판을 볼 수 있습니다.</div>`}</div>
  </section>`;
}

/* ───────── visits ───────── */
function vVisits(){
  const v=D.visits||[], now=Date.now();
  const onlineSince=now-90000;
  const byDay={}; (D.peaks||[]).forEach(p=>{ const k=String(p.day).slice(0,10); (byDay[k]=byDay[k]||{day:k,total:0,minutes:0,srv:{}}); byDay[k].srv[p.server]=p.peak; byDay[k].total+=p.peak; byDay[k].minutes=Math.max(byDay[k].minutes,Number(p.minutes_online)||0); });
  const days=Object.values(byDay).sort((a,b)=>a.day<b.day?1:-1);
  const srvs=[...new Set((D.peaks||[]).map(p=>p.server))].sort();
  return `
  <section class="grid">
    <div class="panel stat"><div class="k">최근 24시간 접속</div><div class="v">${v.length}</div><div class="s">브라우저 기준, 회원과 손님 모두</div></div>
    <div class="panel stat"><div class="k">그중 이름 있는 접속</div><div class="v">${v.filter(x=>x.nickname).length}</div><div class="s">게임 닉네임을 정한 회원</div></div>
    <div class="panel stat"><div class="k">30일 최고 동접</div><div class="v">${Math.max(0,...(D.peaks||[]).map(p=>p.peak))}</div><div class="s">서버 하나 기준 분 단위</div></div>
  </section>
  <section class="panel"><h2>최근 24시간 접속 기록</h2>
    <p class="note">접속 기록은 하루가 지나면 자동으로 지워집니다. 로그인하지 않은 손님은 모습과 세 자리 번호로 보입니다(예 늑대 347). 번호는 브라우저마다 정해져서 같은 창이면 계속 같습니다. 누구인지까지는 알 수 없습니다.</p>
    ${v.length?`<div class="tablewrap"><table><thead><tr><th>상태</th><th>서버</th><th>이름</th><th>모습</th><th>위치</th><th>버전</th><th>처음</th><th>마지막</th><th class="num">머문 시간</th></tr></thead><tbody>
    ${v.map(x=>{ const on=new Date(x.last_seen)>onlineSince; return `<tr><td>${on?`<span class="pill p-open">접속 중</span>`:`<span class="pill p-soon">나감</span>`}</td><td>${esc((x.server||"").toUpperCase())}</td><td>${esc(who(x))}${x.nickname?` <span class="pill p-open">회원</span>`:` <span class="pill p-soon">손님</span>`}</td><td>${esc(formKo(x.form))}</td><td>${esc(x.zone||"")}</td><td>${esc(x.client_ver||"")}</td><td>${fmtTime(x.first_seen)}</td><td>${fmtTime(x.last_seen)}</td><td class="num">${dur((new Date(x.last_seen)-new Date(x.first_seen))/1000)}</td></tr>`; }).join("")}
    </tbody></table></div>`:`<div class="empty">최근 24시간 동안 접속이 없습니다.</div>`}
  </section>
  <section class="panel"><h2>날짜별 최고 동시 접속 (최근 30일)</h2>
    ${days.length?`<div class="tablewrap"><table><thead><tr><th>날짜</th>${srvs.map(s=>`<th class="num">${esc(s.toUpperCase())}</th>`).join("")}<th class="num">누군가 있던 시간</th></tr></thead><tbody>
    ${days.map(d=>`<tr><td>${esc(d.day)}</td>${srvs.map(s=>`<td class="num">${d.srv[s]??0}</td>`).join("")}<td class="num">${dur(d.minutes*60)}</td></tr>`).join("")}
    </tbody></table></div>`:`<div class="empty">아직 쌓인 기록이 없습니다.</div>`}
  </section>`;
}
const VIEWS={overview:vOverview,members:vMembers,visits:vVisits,inbox:vInbox,notice:vNotice,config:vConfig};
function render(){
  const tab=VIEWS[location.hash.slice(1)]?location.hash.slice(1):"overview"; ui.tab=tab;
  document.querySelectorAll("#nav a").forEach(a=>a.getAttribute("href")==="#"+tab?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  const n=D.feedback.filter(f=>f.status==="new").length; const c=$("#newCount"); c.textContent=n; c.hidden=!n;
  $("#mode").textContent=live?"실시간":"시연 데이터"; $("#mode").className="mode"+(live?" live":"");
  $("#authBtn").textContent=live?"로그아웃":"구글로 로그인";
  const keep=document.activeElement?.id;
  $("#main").innerHTML=VIEWS[tab]();
  if(keep&&document.getElementById(keep)&&["reply","fixver","mq"].includes(keep)){ const el=document.getElementById(keep); el.focus(); if(keep==="mq") el.setSelectionRange(el.value.length,el.value.length); }
}

/* ───────── events ───────── */
document.addEventListener("click",async e=>{
  const tr=e.target.closest("tr[data-mid]"); if(tr){ ui.msel=tr.dataset.mid; render(); return; }
  const t=e.target.closest("button"); if(!t) return;
  if(t.id==="mreload"){ delete memo[ui.msel]; await refresh(); return; }
  if(t.id==="googleBtn"){ googleLogin(); return; }
  if(t.dataset.f){ ui[t.dataset.f]=t.dataset.v; render(); return; }
  if(t.classList.contains("item")){ ui.sel=+t.dataset.id; render(); return; }
  if(t.dataset.quick){ const f=D.feedback.find(x=>x.id===ui.sel); const patch={status:t.dataset.quick}; if(t.dataset.quick==="fixed"&&!$("#fixver").value) patch.fixed_version=null;
    if(await save("feedback",{id:f.id},patch)){ toast(FSTATUS[patch.status]+"으로 바꿨습니다"); await refresh(); } return; }
  if(t.dataset.ann){ if(await save("announcements",{id:+t.dataset.ann},{active:t.dataset.on==="true"})){ toast(t.dataset.on==="true"?"공지를 다시 올렸습니다":"공지를 내렸습니다"); await refresh(); } return; }
  if(t.id==="authBtn"){ if(live){ await sb.auth.signOut(); live=false; D=null; await refresh(); toast("로그아웃했습니다"); } else { if(sb) googleLogin(); else { location.hash="#config"; } } return; }
  if(t.id==="signupBtn"){ const email=$("#lemail").value, password=$("#lpw").value; if(!email||password.length<8){ toast("이메일과 8자 이상 비밀번호를 넣어주세요"); return; }
    const {error}=await sb.auth.signUp({email,password}); toast(error?"계정 만들기 실패: "+error.message:"인증 메일을 보냈습니다. 메일함을 확인하세요"); return; }
});
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.dataset.srv){ if(await save("servers",{code:t.dataset.srv},{status:t.value})){ toast("서버 상태를 "+SSTATUS[t.value]+"으로 바꿨습니다"); await refresh(); } }
  if(t.dataset.cap){ const n=Math.max(1,Number(t.value)||1); if(await save("servers",{code:t.dataset.cap},{capacity:n})){ toast("정원을 "+n.toLocaleString()+"명으로 바꿨습니다"); await refresh(); } }
  if(t.dataset.set){ const v=t.dataset.type==="bool"?t.value==="true":t.value; if(await save("settings",{key:t.dataset.set},{value:v,updated_at:new Date().toISOString()})){ toast("설정을 저장했습니다"); await refresh(); } }
});
document.addEventListener("submit",async e=>{
  e.preventDefault(); const id=e.target.id;
  if(id==="replyForm"){ const f=D.feedback.find(x=>x.id===ui.sel); const reply=$("#reply").value.trim();
    const patch={reply:reply||null,fixed_version:$("#fixver").value.trim()||null,status:$("#fstatus").value};
    if(reply&&f.reply!==reply){ patch.replied_at=new Date().toISOString(); if(patch.status==="new") patch.status="done"; }
    if(await save("feedback",{id:f.id},patch)){ toast("답장을 저장했습니다. 플레이어 게임 화면에 표시됩니다"); await refresh(); } }
  if(id==="annForm"){ const ends=$("#aends").value;
    const row={title:$("#atitle").value.trim(),body:$("#abody").value.trim()||null,level:$("#alevel").value,server:$("#aserver").value,ends_at:ends?new Date(ends).toISOString():null,active:true,starts_at:new Date().toISOString()};
    if(await insert("announcements",row)){ toast("공지를 올렸습니다"); await refresh(); } }
  if(id==="setForm"){ const items=[["motd",$("#motd").value],["min_client_version",$("#minver").value],["presence_interval",Number($("#interval").value)||30],["channel_capacity",Number($("#chcap").value)||50],["busy_threshold",(Number($("#busy").value)||70)/100],["full_threshold",(Number($("#full").value)||95)/100]];
    let ok=true; for(const [k,v] of items) ok=(await save("settings",{key:k},{value:v,updated_at:new Date().toISOString()}))&&ok; if(ok){ toast("설정을 저장했습니다"); await refresh(); } }
  if(id==="loginForm"){ if(!sb){ toast("실시간 연결을 쓸 수 없는 환경입니다"); return; }
    const {error}=await sb.auth.signInWithPassword({email:$("#lemail").value,password:$("#lpw").value});
    if(error){ toast("로그인 실패: "+error.message); return; } await goLive(); }
});
document.addEventListener("keydown",e=>{ const tr=e.target.closest?.("tr[data-mid]"); if(tr&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); ui.msel=tr.dataset.mid; render(); } });
document.addEventListener("input",e=>{ if(e.target.id==="mq"){ ui.q=e.target.value; render(); } });
window.addEventListener("hashchange",render);
async function googleLogin(){
  if(!sb){ toast("실시간 연결을 쓸 수 없는 환경입니다"); return; }
  const {error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}});
  if(error) toast("구글 로그인 실패: "+error.message);
}

async function goLive(){
  const {data}=await sb.rpc("is_admin");
  if(data!==true){ toast("로그인은 됐지만 운영자 명단에 없는 계정입니다"); await sb.auth.signOut(); return; }
  live=true; D=null; await refresh(); toast("실시간 데이터로 바꿨습니다"); location.hash="#overview";
}
async function refresh(){ try{ await load(); }catch(err){ toast("불러오기 실패"); } if(D) render(); }

(async function start(){
  try{ if(window.supabase) sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY); }catch(e){ sb=null; }
  await refresh();
  if(sb){ try{ const {data}=await sb.auth.getSession(); if(data.session) await goLive(); }catch(e){} }
  setInterval(()=>{ if(live) refresh(); else if(D){ /* demo: gentle drift so the board feels alive */
    if(Math.random()<.5&&D.presence.length>8) D.presence.pop(); else if(D.presence.length<18) D.presence.push({session_id:"demo-"+Date.now(),server:"kr",nickname:"새시민"+(Date.now()%1000),form:FORMS[Date.now()%8],zone:ZONES[Date.now()%7],first_seen:new Date().toISOString(),last_seen:new Date().toISOString()});
    D.stats.push({ts:new Date().toISOString(),server:"kr",online:D.presence.length}); if(ui.tab==="overview") render(); } },15000);
})();
</script>
</body>
